<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body class="public"><header class="site" id="site-nav"></header>
<section class="hero sub"><div class="wrap"><div><h1>Fitment centres</h1><p>Professional installation by certified partners. Sample network shown for demonstration.</p></div><div class="stage" data-scene="fleet"><img src="../assets/img/truck-route.svg" alt=""></div></div></section><section class="sec"><div class="wrap"><div class="row"><input id="q" class="w300" placeholder="Search city or province…"></div><div class="spacer"></div><div class="grid3" id="list"></div></div></section><section class="cta"><div class="wrap row between"><h2>Ready to protect your vehicles?</h2><a class="btn" href="contact.html">Get a free quote</a></div></section>

<script>Bamu.pub();const C=[['Bamu Pretoria Central','Pretoria','Gauteng','Mon-Fri 07:30-17:00'],['Bamu Midrand Hub','Midrand','Gauteng','Mon-Sat 07:30-16:00'],['Bamu Sandton','Sandton','Gauteng','Mon-Fri 08:00-17:00'],['Bamu Durban North','Durban','KwaZulu-Natal','Mon-Fri 08:00-17:00'],['Bamu Pietermaritzburg','Pietermaritzburg','KwaZulu-Natal','Mon-Fri 08:00-16:30'],['Bamu Cape Town Bellville','Cape Town','Western Cape','Mon-Sat 08:00-17:00'],['Bamu Stellenbosch','Stellenbosch','Western Cape','Mon-Fri 08:00-16:30'],['Bamu Gqeberha','Gqeberha','Eastern Cape','Mon-Fri 08:00-17:00'],['Bamu Bloemfontein','Bloemfontein','Free State','Mon-Fri 08:00-17:00'],['Bamu Polokwane','Polokwane','Limpopo','Mon-Fri 08:00-16:30'],['Bamu Mbombela','Mbombela','Mpumalanga','Mon-Fri 08:00-16:30'],['Bamu Rustenburg','Rustenburg','North West','Mon-Fri 08:00-16:30']];
const q=document.getElementById('q'),l=document.getElementById('list');
function r(){const s=q.value.toLowerCase();const m=C.filter(c=>c.join(' ').toLowerCase().includes(s));l.innerHTML=m.length?m.map(c=>`<div class="card"><h3>${c[0]}</h3><p>${c[1]}, ${c[2]}<br>${c[3]}</p></div>`).join(''):'<p class="empty">No centres match your search.</p>'}
q.oninput=r;r();</script></body></html>
