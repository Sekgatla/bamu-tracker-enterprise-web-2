<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client login · Bamu Tracker</title><meta name="description" content="Sign in to your Bamu Tracker client portal."><link rel="icon" href="../public/favicon.ico">
<link rel="stylesheet" href="../assets/css/variables.css"><link rel="stylesheet" href="../assets/css/global.css"><link rel="stylesheet" href="../assets/css/client-style.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap"><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/db-mock.js"></script></head>
<body class="public">
<div class="login-split"><aside class="login-art"><div><div class="stage" data-scene="car" data-dark><img src="../assets/img/car-shield.svg" alt=""></div><h2>Every vehicle. Every second.</h2><p>Sign in to see live positions, trips, alerts and billing for your fleet.</p></div></aside><div class="login-wrap"><form class="login-card" id="lf"><img class="mark big" src="../assets/img/logo-mark.png" alt="Bamu Tracker"><h1>Client login</h1><p class="muted">Welcome back. Sign in to your Bamu Tracker portal.</p><label>Email<input name="e" type="email" required autocomplete="username"></label><label>Password<input name="p" type="password" required autocomplete="current-password"></label><p class="err" id="er"></p><button class="btn block">Sign in</button><p class="muted"><small>Demo: client@bamu.co.za / Client@123</small></p></form></div></div>

<script>if(Bamu.user('client'))location.replace('../client-portal/index.html');
document.getElementById('lf').onsubmit=e=>{e.preventDefault();const f=e.target,r=Bamu.login('client',f.e.value,f.p.value);if(r.err){document.getElementById('er').textContent=r.err;return}location.href='../client-portal/index.html'};
Bamu.fx&&0;document.querySelectorAll('[data-scene]').forEach(e=>window.Bamu3D&&Bamu3D.mount(e,{type:e.dataset.scene,dark:1}));</script></body></html>
