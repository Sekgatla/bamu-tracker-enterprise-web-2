<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Dispatch Map · Bamu Control Centre</title><link rel="icon" href="../public/favicon.ico">
<link rel="stylesheet" href="../assets/css/variables.css"><link rel="stylesheet" href="../assets/css/global.css"><link rel="stylesheet" href="../assets/css/admin-style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="../assets/js/db-mock.js"></script></head>
<body class="admin"><div id="app"></div>
<script>
const B=Bamu,U=B.ui,esc=B.esc;
const own=id=>{const o=B.find('users',id);return o?esc(o.name):'<small>Unassigned</small>'};
let sel=null;
B.page('admin','dispatch-map.html','Global Fleet Dispatch Map',(v,u)=>{
 B.sim();const d=B.db.devices.filter(x=>x.owner&&x.lat!=null);if(!d.some(x=>x.id===sel))sel=d[0]&&d[0].id;const s=d.find(x=>x.id===sel);
 v.innerHTML='<div class="mapgrid"><canvas class="map"></canvas><aside class="panel">'+(s?`<h3>${esc(s.plate)} ${U.status(s)}</h3><small>${esc(s.vehicle)}</small><dl class="kv"><dt>Customer</dt><dd>${own(s.owner)}</dd><dt>IMEI</dt><dd>${s.imei}</dd><dt>Speed</dt><dd>${Math.round(s.speed)} km/h</dd><dt>Position</dt><dd>${s.lat.toFixed(4)}, ${s.lng.toFixed(4)}</dd><dt>Battery</dt><dd>${s.batt}%</dd><dt>Last seen</dt><dd>${B.ago(s.seen)}</dd></dl><div class="cmdbar"><button class="btn sm ghost" data-act="cmd" data-t="ping" data-id="${s.id}">Ping</button><button class="btn sm ghost" data-act="cmd" data-t="reboot" data-id="${s.id}">Reboot</button>`+(s.immob?`<button class="btn sm" data-act="cmd" data-t="restore" data-id="${s.id}">Restore</button>`:`<button class="btn sm danger" data-act="cmd" data-t="immobilise" data-id="${s.id}">Engine cut</button>`)+'</div><h2>All units ('+d.length+')</h2>':'<p class="empty">No active units</p>')+d.map(x=>`<button class="unit ${x.id===sel?'on':''}" data-act="sel" data-id="${x.id}"><b>${esc(x.plate)}</b>${U.status(x)}</button>`).join('')+'</aside></div>';
 U.map(v.querySelector('canvas'),d,{sel,onSel:id=>{sel=id;B.refresh()}});
 U.on(v,{sel:id=>{sel=+id;B.refresh()},cmd:(id,b)=>{const t=b.dataset.t,run=()=>{const c=B.cmd(id,t,u.name,'admin');U.toast(t+' '+c.status)};t==='immobilise'?U.modal('Engine cut-off',[{t:'note',l:'Immobilise <b>'+esc(s.plate)+'</b>? Logged as '+esc(u.name)+'.'}],run,'Confirm cut'):run()}});
});
</script></body></html>
